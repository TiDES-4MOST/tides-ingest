# /etc/systemd/system/apt-daily.service.d/timeout.conf and
# /etc/systemd/system/apt-daily-upgrade.service.d/timeout.conf (on BOTH VMs)
# apt's daily runs are oneshot services with no time limit. In November 2026 an `apt-get update` on the
# database VM hung on a stalled download for 2.5 days, which also blocked every security update. With
# this limit a hung run is killed after 2 h and the next day's run tries again.
[Service]
TimeoutStartSec=2h
