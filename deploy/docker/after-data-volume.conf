# /etc/systemd/system/docker.service.d/after-data-volume.conf
# With 'nofail' (fstab.example) systemd no longer orders the data volume before Docker. Without this
# drop-in, Docker can start before /srv/tides is mounted (e.g. a slow volume attach after maintenance):
# the Prefect database container then fails to start (create_host_path: false), and Docker does not
# retry a container that failed to start. Wants=, not Requires=: Docker still starts if the volume
# is missing (see "Data volume missing" in deploy/README.md).
[Unit]
Wants=srv-tides.mount
After=srv-tides.mount
