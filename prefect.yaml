# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: tides-ingest
prefect-version: 3.6.11

build:
- prefect_docker.deployments.steps.build_docker_image:
    id: build_image
    requires: prefect-docker>=0.3.1
    image_name: "opr4-ingest-image" # Give it a unique local name
    tag: latest
    dockerfile: auto
    push: false # Do not push anywhere

# Remove or comment out the entire push section
push: null 

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/tides-ingest

deployments:
- name: opr4-deploy
  version: "0.1"
  entrypoint: "./opr4_flows/opr4_controller.py:run_opr4_workflow"
  work_pool:
    name: opr4
    job_variables:
      image: '{{ build_image.image }}'
      # CRITICAL: Tell the worker NOT to look for this on Docker Hub
      image_pull_policy: "IfNotPresent" 
      env:
        # Cleaned up the API URL format
        PREFECT_API_URL: 'http://admin:2436fibres!@prefect.tides.lsst.ac.uk/api'