# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: tides-ingest
prefect-version: 3.6.10
# ... (metadata remains the same)

build:
- prefect_docker.deployments.steps.build_docker_image:
    id: build_image
    requires: prefect-docker>=0.3.1
    image_name: "opr4_ingest"
    tag: latest
    dockerfile: auto
    # REMOVED: push: false (this was causing the TypeError)

# REMOVE the push section entirely to ensure no push is attempted
push: null 

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/tides-ingest

deployments:
- name: opr4-deploy
  version: "0.1"
  entrypoint: "tides_flows/tides_controller.py:run_target_workflow"
  # Never two ingest runs at once (the flow also takes a Postgres advisory lock).
  # A run that finds the slot busy is cancelled rather than queued behind it.
  concurrency_limit:
    limit: 1
    collision_strategy: CANCEL_NEW
  work_pool:
    name: opr4
    job_variables:
      image: '{{ build_image.image }}'
      # CRITICAL: This tells the Docker worker to use your local build
      # instead of trying to pull "opr4_ingest" from Docker Hub.
      image_pull_policy: "IfNotPresent" 
      # Secrets: the .env on the worker host is mounted read-only at run time (it is NOT in
      # the image any more, see .dockerignore). load_dotenv() finds it next to tides_flows/.
      # Deploy with:  TIDES_ENV_FILE=/abs/path/to/.env GIT_SHA=$(git rev-parse --short=12 HEAD) prefect deploy
      volumes:
        - "{{ $TIDES_ENV_FILE }}:/opt/prefect/tides-ingest/.env:ro"
      env:
        PREFECT_API_URL: "{{ $PREFECT_SECRET_API }}"
        GIT_SHA: "{{ $GIT_SHA }}"   # recorded in tides_events / tides_4most_log (.git is not in the image)